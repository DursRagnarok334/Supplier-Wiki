const FILE_ICONS = { PDF:{c:'#DC2626',bg:'#FEF2F2'}, XLSX:{c:'#16A34A',bg:'#F0FDF4'}, DOCX:{c:'#2563EB',bg:'#EFF6FF'}, LINK:{c:'#7C3AED',bg:'#F5F3FF'} };
function fileMeta(name){ const ext=(name.split('.').pop()||'').toLowerCase();
  const map={pdf:'PDF',xlsx:'XLSX',xls:'XLSX',docx:'DOCX',doc:'DOCX',csv:'CSV',txt:'TXT',png:'IMG',jpg:'IMG',jpeg:'IMG'};
  const label = map[ext] || (ext.toUpperCase()||'FILE');
  const colors = {PDF:['#DC2626','#FEF2F2'],XLSX:['#16A34A','#F0FDF4'],DOCX:['#2563EB','#EFF6FF'],CSV:['#0891B2','#ECFEFF'],TXT:['#6B7280','#F9FAFB'],IMG:['#7C3AED','#F5F3FF'],FILE:['#6B7280','#F9FAFB']};
  const [c,bg] = colors[label]||colors.FILE;
  return {label,c,bg};
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

/* ════════════════════════════════════════════════════════════════════════
   ESTADO — persistido en localStorage y, si está configurado, en Firestore
   ════════════════════════════════════════════════════════════════════════ */
const State = {
  activeId: 'proveedores',
  openGroups: new Set(['static-data','documentacion']),
  searchQuery: '',
  searchOpen: false,
  drawers: JSON.parse(localStorage.getItem('ws_drawers') || 'null') || DEFAULT_DRAWERS,
  suppliers: JSON.parse(localStorage.getItem('ws_suppliers') || 'null') || ['TechSupply Corp','DataBridge SL','LogiTech SA','CloudOps EU','EuroData GmbH'],
  staticRecords: JSON.parse(localStorage.getItem('ws_static') || 'null') || { 'std-automatica': [], 'std-manual-ftp': [] },
  aiOpen: false,
  aiMessages: [],
  aiLoading: false,
};

function persist(){
  localStorage.setItem('ws_drawers', JSON.stringify(State.drawers));
  localStorage.setItem('ws_suppliers', JSON.stringify(State.suppliers));
  localStorage.setItem('ws_static', JSON.stringify(State.staticRecords));
  if (FIREBASE_ENABLED && db) {
    db.collection('wiki_suppliers').doc('data').set({
      drawers: State.drawers, suppliers: State.suppliers, staticRecords: State.staticRecords,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(e => console.error('Firestore sync error:', e));
  }
}
async function loadFromFirestore(){
  if (!FIREBASE_ENABLED || !db) return;
  try {
    const snap = await db.collection('wiki_suppliers').doc('data').get();
    if (snap.exists) {
      const d = snap.data();
      if (d.drawers) State.drawers = d.drawers;
      if (d.suppliers) State.suppliers = d.suppliers;
      if (d.staticRecords) State.staticRecords = d.staticRecords;
      render();
    }
    // Escucha cambios en vivo de otros miembros del equipo
    db.collection('wiki_suppliers').doc('data').onSnapshot(snap => {
      if (!snap.exists) return;
      const d = snap.data();
      if (d.drawers) State.drawers = d.drawers;
      if (d.suppliers) State.suppliers = d.suppliers;
      if (d.staticRecords) State.staticRecords = d.staticRecords;
      render();
    });
  } catch(e){ console.error('Error cargando Firestore:', e); }
}

function searchableText(id, page){
  return [page.title, page.description, page.objective,
    ...page.steps.map(s=>s.title+' '+s.content),
    ...page.attachments.map(a=>a.name)].join(' ').toLowerCase();
}
function doSearch(q){
  q = q.trim().toLowerCase();
  if (!q) return null;
  return Object.entries(PAGES).filter(([id,p]) => searchableText(id,p).includes(q))
    .map(([id,p]) => ({ id, title: p.title, breadcrumbs: p.breadcrumbs, description: p.description }));
}

            <p class="flex-1 text-sm font-semibold text-gray-800">${esc(d.title)}</p>
            <span class="text-xs text-gray-400 flex-shrink-0 hidden sm:block">Editado ${esc(d.lastEdited)}</span>
            <div class="flex items-center gap-1 ml-2" onclick="event.stopPropagation()">
              <button onclick="drawerEdit(${d.id})" class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="drawerDelete(${d.id})" class="p-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
            <i class="fa-solid fa-chevron-down text-gray-400 text-xs transition-transform" style="transform:rotate(${isOpen?180:0}deg)"></i>
          </div>
          ${isOpen ? `<div class="border-t px-5 py-5" style="border-color:#E5E7EB">
            ${isEditing ? drawerFormHTML('Guardar cambios', `drawerSaveEdit(${d.id})`, true)
              : `<p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">${d.content ? nl2br(d.content) : '<span class="italic text-gray-400">Sin contenido.</span>'}</p>`}
          </div>` : ''}
        </div>`; }).join('')}
    </div>`}
  </article>`;
}

/* ── Static Data ── */
let staticForm = { supplier:'', description:'', files:[] };
let staticExpanded = null;

function staticHandleFiles(input, activeId){
  Array.from(input.files||[]).forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => {
      const size = f.size<1024?`${f.size} B`:f.size<1048576?`${(f.size/1024).toFixed(1)} KB`:`${(f.size/1048576).toFixed(1)} MB`;
      staticForm.files.push({ name: f.name, size, dataUrl: ev.target.result });
      renderMain();
    };
    reader.readAsDataURL(f);
  });
  input.value = '';
}
function staticRemovePending(i){ staticForm.files.splice(i,1); renderMain(); }
function staticSubmit(activeId){
  if (!staticForm.supplier.trim()) return;
  const today = new Date().toLocaleDateString('es-ES');
  State.staticRecords[activeId].unshift({ id: Date.now(), supplier: staticForm.supplier.trim(), description: staticForm.description.trim(), files: staticForm.files, createdAt: today });
  staticForm = { supplier:'', description:'', files:[] };
  persist(); renderMain();
}
function staticDelete(activeId, id){ State.staticRecords[activeId] = State.staticRecords[activeId].filter(r=>r.id!==id); persist(); renderMain(); }
function staticToggle(id){ staticExpanded = staticExpanded===id ? null : id; renderMain(); }

function renderStaticDataPage(activeId){
  const isAuto = activeId === 'std-automatica';
  const title = isAuto ? 'Static Data – Tareas Automáticas' : 'Static Data – Tareas Manuales FTP';
  const crumbs = isAuto ? ['Wiki Suppliers','Static Data','Tareas Automáticas'] : ['Wiki Suppliers','Static Data','Tareas Manuales FTP'];
  const subtitle = isAuto ? 'Registros de procesos de sincronización automática por proveedor.' : 'Registros de transferencias manuales FTP/SFTP por proveedor.';
  const records = State.staticRecords[activeId];

  return `
  <article class="max-w-4xl mx-auto px-8 py-8 fade-in">
    ${breadcrumbsHTML(crumbs)}
    <h1 class="text-3xl font-bold text-gray-900 mb-2" style="letter-spacing:-0.02em">${title}</h1>
    <p class="text-sm text-gray-500 mb-8">${subtitle}</p>

    <section class="mb-10 rounded-xl border border-gray-200 bg-white overflow-hidden shadow-sm">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center gap-2" style="background:#fafafa"><i class="fa-solid fa-plus text-xs" style="color:#C8102E"></i><h2 class="text-sm font-semibold text-gray-700">Nuevo registro</h2></div>
      <div class="px-6 py-5 space-y-4">
        <div><label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Proveedor <span style="color:#C8102E">*</span></label>
          <input type="text" placeholder="Nombre del proveedor…" value="${esc(staticForm.supplier)}" oninput="staticForm.supplier=this.value"
            class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-200 bg-gray-50 outline-none focus:border-red-300 focus:ring-2 focus:ring-red-100"></div>
        <div><label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Descripción del documento</label>
          <textarea rows="3" placeholder="Describe el contenido, propósito o notas relevantes…" oninput="staticForm.description=this.value"
            class="w-full px-4 py-3 text-sm rounded-lg border border-gray-200 bg-gray-50 outline-none focus:border-red-300 focus:ring-2 focus:ring-red-100 resize-none">${esc(staticForm.description)}</textarea></div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Archivos adjuntos</label>
          <div onclick="document.getElementById('staticFileInput_${activeId}').click()"
            class="flex flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-gray-200 py-6 cursor-pointer hover:border-red-300 hover:bg-red-50">
            <i class="fa-solid fa-cloud-arrow-up text-xl opacity-60" style="color:#C8102E"></i>
            <p class="text-sm text-gray-500">Arrastra archivos aquí o <span class="font-semibold" style="color:#C8102E">haz clic para seleccionar</span></p>
            <p class="text-xs text-gray-400">PDF, XLSX, DOCX, CSV, imágenes…</p>
          </div>
          <input id="staticFileInput_${activeId}" type="file" multiple class="hidden" onchange="staticHandleFiles(this,'${activeId}')">
          ${staticForm.files.length ? `<ul class="mt-3 space-y-1.5">
            ${staticForm.files.map((f,i) => { const m=fileMeta(f.name); return `
            <li class="flex items-center gap-3 px-3 py-2 rounded-lg bg-gray-50 border border-gray-200">
              <span class="text-xs font-bold rounded px-1.5 py-0.5" style="background:${m.bg};color:${m.c};font-family:monospace">${m.label}</span>
              <span class="flex-1 text-sm text-gray-700 truncate">${esc(f.name)}</span>
              <span class="text-xs text-gray-400 flex-shrink-0">${f.size}</span>
              <button onclick="staticRemovePending(${i})" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xs"></i></button>
            </li>`; }).join('')}</ul>` : ''}
        </div>
        <div class="flex justify-end pt-2">
          <button onclick="staticSubmit('${activeId}')" class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white" style="background:#C8102E;opacity:${staticForm.supplier.trim()?1:.45}">Guardar registro</button>
        </div>
      </div>
    </section>

    ${records.length===0 ? `
    <div class="flex flex-col items-center justify-center py-16 rounded-xl border-2 border-dashed border-gray-200 text-gray-400">
      <i class="fa-regular fa-file-lines text-3xl mb-3 opacity-40"></i><p class="text-sm font-medium">Sin registros todavía</p></div>` : `
    <div class="space-y-3">
      ${records.map(rec => { const isOpen = staticExpanded===rec.id; return `
      <div class="rounded-xl border border-gray-200 bg-white overflow-hidden shadow-sm">
        <div class="flex items-center gap-4 px-5 py-4 cursor-pointer hover:bg-gray-50" onclick="staticToggle(${rec.id})">
          <div class="flex items-center justify-center rounded-full text-xs font-bold flex-shrink-0 text-white" style="width:34px;height:34px;background:#C8102E">${esc(rec.supplier.charAt(0).toUpperCase())}</div>
          <div class="flex-1 min-w-0"><p class="text-sm font-semibold text-gray-800 truncate">${esc(rec.supplier)}</p>${rec.description?`<p class="text-xs text-gray-500 truncate mt-0.5">${esc(rec.description)}</p>`:''}</div>
          <div class="flex items-center gap-3 flex-shrink-0">
            ${rec.files.length ? `<span class="flex items-center gap-1 text-xs text-gray-400"><i class="fa-regular fa-file-lines"></i>${rec.files.length}</span>`:''}
            <span class="text-xs text-gray-400">${esc(rec.createdAt)}</span>
            <i class="fa-solid fa-chevron-down text-gray-400 text-xs transition-transform" style="transform:rotate(${isOpen?180:0}deg)"></i>
          </div>
        </div>
        ${isOpen ? `<div class="px-5 pb-5 border-t border-gray-100">
          ${rec.description ? `<div class="pt-4 pb-3"><p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Descripción</p><p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">${esc(rec.description)}</p></div>`:''}
          ${rec.files.length ? `<div class="${rec.description?'pt-3 border-t border-gray-100':'pt-4'}"><p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Archivos adjuntos (${rec.files.length})</p>
            <ul class="space-y-1.5">${rec.files.map(f => { const m=fileMeta(f.name); return `
              <li class="attachment-card flex items-center gap-3 px-4 py-2.5 rounded-lg border border-gray-200 bg-white">
                <span class="flex items-center justify-center rounded-md text-xs font-bold flex-shrink-0" style="width:36px;height:36px;background:${m.bg};color:${m.c};font-family:monospace">${m.label}</span>
                <div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-800 truncate">${esc(f.name)}</p><p class="text-xs text-gray-400 mt-0.5">${f.size}</p></div>
                <a href="${f.dataUrl}" download="${esc(f.name)}" onclick="event.stopPropagation()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#FEF2F2;color:#C8102E"><i class="fa-solid fa-download"></i> Descargar</a>
              </li>`; }).join('')}</ul></div>`:''}
          ${!rec.files.length && !rec.description ? `<p class="pt-4 text-sm text-gray-400">Sin descripción ni archivos adjuntos.</p>`:''}
          <div class="flex justify-end mt-4 pt-3 border-t border-gray-100">
            <button onclick="staticDelete('${activeId}',${rec.id})" class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i> Eliminar registro</button>
          </div>
        </div>`:''}
      </div>`; }).join('')}
    </div>`}
  </article>`;
}

/* ── Main render ── */
function renderMain(){
  let html;
  if (State.searchOpen && State.searchQuery.trim()) {
    const results = doSearch(State.searchQuery);
    html = `<div class="max-w-4xl mx-auto px-8 py-8 fade-in">
      <h2 class="text-xl font-bold text-gray-800 mb-1">Resultados de búsqueda</h2>
      <p class="text-sm text-gray-500 mb-6">${results.length} artículo(s) encontrado(s) para "${esc(State.searchQuery)}"</p>
      <div class="space-y-3">${results.map(r => `
        <button onclick="navigate('${r.id}')" class="w-full text-left rounded-xl border border-gray-200 bg-white px-6 py-4 hover:border-red-200 hover:shadow-sm">
          <p class="text-sm font-semibold text-gray-800">${esc(r.title)}</p><p class="text-xs text-gray-400 mt-1">${esc(r.breadcrumbs.join(' › '))}</p>
          <p class="text-sm text-gray-500 mt-2">${esc(r.description)}</p></button>`).join('')}</div></div>`;
  } else if (State.activeId === 'tickets') html = renderTicketsPage();
  else if (State.activeId === 'std-automatica' || State.activeId === 'std-manual-ftp') html = renderStaticDataPage(State.activeId);
  else if (State.activeId === 'proveedores') html = renderSupplierListPage();
  else html = renderPageContent(PAGES[State.activeId]);
  document.getElementById('mainSlot').innerHTML = html;
}

function render(){
  document.getElementById('app').innerHTML = `
    <div id="headerSlot">${renderHeader()}</div>
    <div class="flex flex-1 min-h-0">
      ${renderSidebar()}
      <main class="flex-1 overflow-y-auto bg-white relative">
        <div id="mainSlot"></div>
      </main>
    </div>
    ${renderAIPanel()}
  `;
  renderMain();
}

/* ════════════════════════════════════════════════════════════════════════
   ASISTENTE IA (Groq) — búsqueda, análisis y refinamiento de la información
   Las peticiones van a CONFIG.groqProxyUrl (nunca directo a Groq), que oculta
   la API key. Ver groq-proxy-worker.js.
   ════════════════════════════════════════════════════════════════════════ */
function toggleAI(){ State.aiOpen = !State.aiOpen; render(); if(State.aiOpen) document.getElementById('aiInput')?.focus(); }

function renderAIPanel(){
  return `
  <div id="ai-panel" class="fixed top-0 right-0 h-full w-96 max-w-full bg-white border-l border-gray-200 shadow-2xl z-40 flex flex-col"
       style="transform:translateX(${State.aiOpen?'0':'100%'})">
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100" style="background:#C8102E">
      <div class="flex items-center gap-2 text-white"><i class="fa-solid fa-wand-magic-sparkles"></i><span class="font-semibold text-sm">Asistente IA · Wiki Suppliers</span></div>
      <button onclick="toggleAI()" class="text-white opacity-80 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
    </div>
    ${!CONFIG.groqProxyUrl ? `
    <div class="p-5 text-sm text-gray-600 leading-relaxed">
      <i class="fa-solid fa-triangle-exclamation mb-2" style="color:#D97706"></i>
      <p>El asistente aún no está conectado. Despliega <code class="bg-gray-100 px-1 rounded">groq-proxy-worker.js</code> y añade la URL en <code class="bg-gray-100 px-1 rounded">CONFIG.groqProxyUrl</code>.</p>
    </div>` : `
    <div id="aiMessages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 text-sm">
      ${State.aiMessages.length===0 ? `<p class="text-gray-400 text-xs">Pregunta lo que necesites sobre proveedores, Static Data, tickets, errores comunes o documentación. El asistente responde con base en el contenido de esta wiki.</p>` :
        State.aiMessages.map(m => `
        <div class="flex ${m.role==='user'?'justify-end':'justify-start'}">
          <div class="max-w-[85%] rounded-lg px-3 py-2 ${m.role==='user'?'text-white':'bg-gray-100 text-gray-800'}" style="${m.role==='user'?'background:#C8102E':''}">
            <p class="whitespace-pre-wrap">${esc(m.content)}</p>
          </div>
        </div>`).join('')}
      ${State.aiLoading ? `<div class="flex justify-start"><div class="bg-gray-100 rounded-lg px-3 py-2"><span class="typing-dot">●</span> <span class="typing-dot">●</span> <span class="typing-dot">●</span></div></div>` : ''}
    </div>
    <div class="border-t border-gray-100 p-3">
      <div class="flex gap-2">
        <input id="aiInput" type="text" placeholder="Escribe tu pregunta…" onkeydown="if(event.key==='Enter')sendAIMessage()"
          class="flex-1 px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 outline-none focus:border-red-300 focus:ring-2 focus:ring-red-100">
        <button onclick="sendAIMessage()" class="px-3 py-2 rounded-lg text-white" style="background:#C8102E"><i class="fa-solid fa-paper-plane text-xs"></i></button>
      </div>
    </div>`}
  </div>`;
}

function wikiContextForAI(){
  // Serializa el contenido de la wiki como contexto para el modelo (RAG simple)
  return Object.entries(PAGES).map(([id,p]) => `### ${p.title}\n${p.description}\n${p.steps.map(s=>`- ${s.title}: ${s.content}`).join('\n')}`).join('\n\n')
    + '\n\n### Proveedores preferred\n' + State.suppliers.join(', ')
    + '\n\n### Cajones de tickets\n' + State.drawers.map(d=>`- ${d.title}: ${d.content}`).join('\n');
}

async function sendAIMessage(){
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text || !CONFIG.groqProxyUrl) return;
  State.aiMessages.push({ role:'user', content:text });
  input.value = '';
  State.aiLoading = true;
  render(); document.getElementById('aiMessages').scrollTop = 1e9;

  try {
    const res = await fetch(CONFIG.groqProxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: 'Eres el asistente de la Wiki Suppliers de Juniper. Responde en español, de forma breve y precisa, basándote solo en el CONTEXTO proporcionado. Si la respuesta no está en el contexto, dilo claramente.\n\nCONTEXTO:\n' + wikiContextForAI() },
          ...State.aiMessages
        ]
      })
    });
    const data = await res.json();
    State.aiMessages.push({ role:'assistant', content: data.reply || 'No se recibió respuesta del asistente.' });
  } catch(e){
    State.aiMessages.push({ role:'assistant', content: 'Error al conectar con el asistente. Verifica el proxy de Groq.' });
  }
  State.aiLoading = false;
  render();
  document.getElementById('aiMessages').scrollTop = 1e9;
}

/* ════════════════════════════════════════════════════════════════════════
   INICIO
   ════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  if (State.searchOpen && !e.target.closest('#searchInput') && !e.target.closest('#headerSlot')) { State.searchOpen=false; renderHeaderOnly(); }
});
render();
if (FIREBASE_ENABLED) loadFromFirestore();
</script>
